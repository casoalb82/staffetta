# Staffetta configuration. Copy to config.toml (which git ignores).

service_nick = "Staffetta"
service_realname = "Staffetta relay bot (not a person)"
state_dir = "state"

# Owners must be logged in to services to manage a link.
require_account_for_owner = false
# Relay users that are flagged as bots (off = never).
relay_bots = false
# How the origin network is added to a puppet's nick: pipe | bracket | underscore
nick_style = "pipe"
# Language the service uses with channel operators: it | en (per channel: SET #chan lang en)
default_lang = "it"

[[network]]
id = "examplea"
label = "Example A"
host = "irc.example-a.org"
port = 6697
tls = true                 # plain text is refused except to localhost
transport = "puppets"      # or "service-bot" (one labelled relay bot, no extra connections)
max_puppets = 60
max_nick = 30
# Beat per-IP connection limits: every puppet connects from its own IPv6 address
# inside this routed prefix (see docs/INSTALL.md for the OS setup).
# puppet_ipv6_pool = "2001:db8:1:2::/64"

[[network]]
id = "exampleb"
label = "Example B"
host = "irc.example-b.org"
port = 6697
tls = true
transport = "service-bot"
